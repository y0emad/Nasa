name: NASA Project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    services:
      mongodb:
        image: public.ecr.aws/docker/library/mongo:7
        ports:
          - 27017:27017

    env:
      CI: true
      MONGO_URI: mongodb://localhost:27017/nasa_test

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix client
          npm ci --prefix server

      - name: Typecheck server
        run: npm run typecheck --prefix server

      - name: Build server
        run: npm run build --prefix server

      - name: Build client
        run: npm run build --prefix client

      - name: Run tests
        run: npm test --prefix server

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix client

      - name: Install Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: client
        run: npm run test:e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 7

  docker:
    name: Docker build & publish
    runs-on: ubuntu-latest
    needs: [build, e2e]
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'nasa' }}/nasa:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'nasa' }}/nasa:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
